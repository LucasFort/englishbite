<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — EnglishBite</title>
<link rel="icon" href="img/bee.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="auth-top">
    <a href="index.html" class="icon-btn" aria-label="Fechar">✕</a>
    
  </header>

  <div class="center-screen">
    <div class="auth-card">
      <h1>Redefinir senha</h1>
      <p class="lead">Digite o código enviado para <strong id="emailLabel"></strong> e sua nova senha.</p>

      <div class="alert alert-info" id="devBox"></div>
      <div class="alert alert-error" id="errorBox"></div>
      <div class="alert alert-success" id="successBox"></div>

      <form id="resetForm">
        <div class="field">
          <label for="code">Código</label>
          <input type="text" id="code" required maxlength="6" placeholder="000000" inputmode="numeric">
        </div>
        <div class="field">
          <label for="password">Nova senha</label>
          <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Redefinir senha</button>
      </form>

      <p class="form-footer"><a href="login.html">Voltar para o login</a></p>
    </div>
  </div>

  <script src="js/sounds.js"></script>
  <script src="js/api.js"></script>
  <script>
    const email = sessionStorage.getItem("eb_reset_email");
    if (!email) window.location.href = "forgot.html";
    document.getElementById("emailLabel").textContent = email;

    const devCode = sessionStorage.getItem("eb_dev_code");
    const devBox = document.getElementById("devBox");
    if (devCode) {
      devBox.textContent = "Modo teste (sem envio real de e-mail): seu código é " + devCode;
      devBox.classList.add("show");
    }

    const form = document.getElementById("resetForm");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Salvando...";

      const code = document.getElementById("code").value.trim();
      const password = document.getElementById("password").value;

      try {
        await Api.request("/api/reset-password", { method: "POST", body: { email, code, password } });
        sessionStorage.removeItem("eb_reset_email");
        sessionStorage.removeItem("eb_dev_code");
        successBox.textContent = "Senha redefinida! Redirecionando para o login...";
        successBox.classList.add("show");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Redefinir senha";
      }
    });
  </script>
</body>
</html>
